{% extends 'main/base.html' %}

{% block title %}ثبت‌نام | وب‌سایت من{% endblock %}

{% block content %}
<section class="card">
    <h1>ساخت حساب کاربری</h1>
    <p>برای ایجاد حساب، اطلاعات زیر را تکمیل کنید.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ایجاد حساب</button>
    </form>
    <p>قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
</section>
{% endblock %}
