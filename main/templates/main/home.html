<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی</title>
</head>
<body>
    <h1>به سایت من خوش آمدید</h1>

    {% if user.is_authenticated %}
        <h2>سلام {{ user.username }}</h2>
        <p>شما وارد حساب کاربری شده‌اید.</p>
        <a href="{% url 'profile' %}">مشاهده پروفایل</a>
        |
        <a href="{% url 'logout' %}">خروج از حساب</a>
    {% else %}
        <p>برای استفاده از امکانات سایت وارد شوید.</p>
        <a href="{% url 'register' %}">ثبت نام</a>
        |
        <a href="{% url 'login' %}">ورود</a>
    {% endif %}
</body>
</html>
