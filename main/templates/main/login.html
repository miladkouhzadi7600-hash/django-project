{% extends 'main/base.html' %}

{% block title %}ورود | وب‌سایت من{% endblock %}

{% block content %}
<section class="card">
    <h1>ورود به حساب کاربری</h1>
    <p>برای ورود، نام کاربری و رمز عبور خود را وارد کنید.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ورود</button>
    </form>
    <p><a href="{% url 'password_reset' %}">رمز عبور را فراموش کرده‌اید؟</a></p>
    <p>هنوز حساب ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a></p>
</section>
{% endblock %}
