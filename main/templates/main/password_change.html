{% extends 'main/base.html' %}

{% block title %}تغییر رمز عبور | وب‌سایت من{% endblock %}

{% block content %}
<section class="card">
    <h1>تغییر رمز عبور</h1>
    <p>برای امنیت حساب، رمز عبور فعلی و سپس رمز جدید را وارد کنید.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ثبت رمز عبور جدید</button>
    </form>

    <div class="actions">
        <a class="button button-secondary" href="{% url 'profile' %}">بازگشت به پروفایل</a>
    </div>
</section>
{% endblock %}
