{% extends 'main/base.html' %}
{% block title %}بازیابی رمز عبور{% endblock %}
{% block content %}
<section class="card">
    <h1>بازیابی رمز عبور</h1>
    <p>ایمیل ثبت‌شده در حساب خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ارسال لینک بازیابی</button>
    </form>
    <a href="{% url 'login' %}">بازگشت به ورود</a>
</section>
{% endblock %}
